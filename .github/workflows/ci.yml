name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test the templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/ is built from src/
        run: git diff --exit-code dist/ || (echo "run npm run build and commit dist/" && exit 1)
