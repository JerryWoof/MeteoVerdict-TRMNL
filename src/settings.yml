- keyname: forecast_model
  field_type: select
  name: Forecast
  description: MeteoVerdict AI (MeteoVerdict's own AI model), or MeteoVerdict's combined forecast of all models, with the range of the temperature.
  options:
  - "MeteoVerdict AI": ai/okresy
  - "MeteoVerdict (all models combined)": okresy
  default: ai/okresy
- keyname: obec
  field_type: string
  name: Obec
  description: The id of an obec (village or town) in the okres chosen above, for its own forecast instead of the okres's, e.g. velemin. The id is the name in lower case without diacritics, with - for spaces (the list is on the Data page of meteoverdict.cz). Needs the two-line Polling URL (see the plugin's page on GitHub).
  placeholder: velemin
  optional: true
- keyname: view
  field_type: select
  name: View (full screen)
  description: What the screen shows.
  options:
  - "Today and tomorrow": today_tomorrow
  - "Next 24 hours": next_24h
  - "Next 48 hours": next_48h
  - "5 days": five_days
  default: today_tomorrow
- keyname: place
  field_type: string
  name: Place name
  description: Shown in the title bar instead of the okres name, e.g. your town.
  placeholder: Říčany
  optional: true
- keyname: evening_switch
  field_type: boolean
  name: Move on to tomorrow in the evening
  description: After 18:00 the day layouts show tomorrow and the day after instead of today and tomorrow, .
  default: true
- keyname: wind_unit
  field_type: select
  name: Wind speed in
  options:
  - "m/s": ms
  - "km/h": kmh
  default: ms
- keyname: language
  field_type: select
  name: Language
  options:
  - "English": en
  - "Čeština": cs
  default: en
