- keyname: forecast
  field_type: select
  name: Forecast
  description: MeteoVerdict's combined forecast (all models, with the range of the temperature), or MeteoVerdict AI, experimental, for temperature and wind (the rest stays the combined forecast).
  options:
  - "MeteoVerdict (all models combined)": okresy
  - "MeteoVerdict AI (experimental)": ai/okresy
  default: okresy
- keyname: view
  field_type: select
  name: View (full screen)
  description: What the full screen shows. Half and quarter screens always show today and the next days.
  options:
  - "Today and tomorrow": today_tomorrow
  - "Next 24 hours": next_24h
  - "5 days": five_days
  - "Weekend": weekend
  default: today_tomorrow
- keyname: place
  field_type: string
  name: Place name
  description: Shown in the title bar instead of the okres name, e.g. your town.
  placeholder: Říčany
  optional: true
- keyname: evening_switch
  field_type: boolean
  name: Move on to tomorrow in the evening
  description: After 18:00 the day layouts show tomorrow and the day after instead of today and tomorrow, and the weekend view looks a day ahead (on Sunday evening, the next weekend).
  default: true
- keyname: wind_unit
  field_type: select
  name: Wind speed in
  options:
  - "m/s": ms
  - "km/h": kmh
  default: ms
- keyname: language
  field_type: select
  name: Language
  options:
  - "English": en
  - "Čeština": cs
  default: en
